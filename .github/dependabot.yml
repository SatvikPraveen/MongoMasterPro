version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    # Major upgrades are done deliberately as separate migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    # Major upgrades are done deliberately as separate migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    # Major upgrades are done deliberately as separate migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
